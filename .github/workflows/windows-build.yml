name: Windows Build

on:
  push:
    branches: [main, feat/desktop-pet-mvp]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build Debug
        run: cmake --build build --config Debug --parallel
      - name: Run CTest
        run: $env:QT_QPA_PLATFORM = 'offscreen'; ctest --test-dir build -C Debug --output-on-failure

